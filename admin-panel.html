<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UC Coin Ultra - Admin Panel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: white;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }
        
        .btn-success {
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
        }
        
        .btn-danger {
            background: linear-gradient(135deg, #f44336 0%, #d32f2f 100%);
        }
        
        .btn-warning {
            background: linear-gradient(135deg, #ff9800 0%, #f57c00 100%);
        }
        
        .input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            color: white;
            font-size: 14px;
            margin-bottom: 16px;
        }
        
        .input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }
        
        .input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.3);
        }
        
        .grid {
            display: grid;
            gap: 24px;
        }
        
        .grid-2 { grid-template-columns: repeat(2, 1fr); }
        .grid-3 { grid-template-columns: repeat(3, 1fr); }
        .grid-4 { grid-template-columns: repeat(4, 1fr); }
        
        .nav {
            display: flex;
            gap: 8px;
            margin-bottom: 32px;
            background: rgba(0, 0, 0, 0.3);
            padding: 8px;
            border-radius: 12px;
        }
        
        .nav-btn {
            padding: 12px 20px;
            background: transparent;
            color: rgba(255, 255, 255, 0.7);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }
        
        .nav-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }
        
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .modal.show {
            display: flex;
        }
        
        .modal-content {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border-radius: 16px;
            padding: 32px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            overflow: hidden;
        }
        
        .table th,
        .table td {
            padding: 16px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .table th {
            background: rgba(255, 255, 255, 0.1);
            font-weight: 600;
        }
        
        .table tr:hover {
            background: rgba(255, 255, 255, 0.05);
        }
        
        .status-active { color: #4CAF50; }
        .status-banned { color: #f44336; }
        .status-pending { color: #ff9800; }
        .status-approved { color: #4CAF50; }
        .status-rejected { color: #f44336; }
        
        .hidden { display: none !important; }
        
        .fade-in {
            animation: fadeIn 0.3s ease-in;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .stat-card {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.2) 0%, rgba(118, 75, 162, 0.2) 100%);
            border: 1px solid rgba(102, 126, 234, 0.3);
            border-radius: 16px;
            padding: 24px;
            text-align: center;
        }
        
        .stat-number {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .stat-label {
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
        }
        
        .select {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            color: white;
            font-size: 14px;
        }
        
        .textarea {
            width: 100%;
            min-height: 100px;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            color: white;
            font-size: 14px;
            resize: vertical;
            font-family: inherit;
        }
        
        .checkbox {
            margin-right: 8px;
        }
        
        .flex {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .text-center { text-align: center; }
        .text-success { color: #4CAF50; }
        .text-danger { color: #f44336; }
        .text-warning { color: #ff9800; }
        
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #667eea;
            animation: spin 1s ease-in-out infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- Login Screen -->
    <div id="loginScreen" class="container">
        <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center;">
            <div class="card" style="max-width: 400px; width: 100%;">
                <div class="text-center" style="margin-bottom: 32px;">
                    <div style="width: 80px; height: 80px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; font-size: 2rem;">🔐</div>
                    <h1 style="font-size: 2rem; margin-bottom: 8px;">Admin Panel</h1>
                    <p style="color: rgba(255, 255, 255, 0.7);">UC Coin Ultra Management</p>
                </div>
                
                <form id="loginForm">
                    <div class="form-group">
                        <label class="form-label">Email</label>
                        <input type="email" id="adminEmail" class="input" placeholder="admin@example.com" required>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Password</label>
                        <input type="password" id="adminPassword" class="input" placeholder="Enter password" required>
                    </div>
                    
                    <button type="submit" class="btn" style="width: 100%;">Login</button>
                </form>
                
                <div id="loginError" class="hidden" style="margin-top: 16px; padding: 12px; background: rgba(244, 67, 54, 0.2); border: 1px solid rgba(244, 67, 54, 0.5); border-radius: 8px; color: #f44336;"></div>
            </div>
        </div>
    </div>

    <!-- Main Dashboard -->
    <div id="dashboard" class="hidden">
        <!-- Header -->
        <header style="background: rgba(0, 0, 0, 0.3); padding: 20px; margin-bottom: 32px; border-radius: 16px;">
            <div class="flex-between">
                <div class="flex">
                    <div style="width: 60px; height: 60px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem;">⚡</div>
                    <div>
                        <h1 style="font-size: 1.5rem; margin-bottom: 4px;">UC Coin Ultra</h1>
                        <p style="color: rgba(255, 255, 255, 0.7);">Admin Dashboard</p>
                    </div>
                </div>
                
                <div class="flex">
                    <span id="adminInfo" style="margin-right: 16px; color: rgba(255, 255, 255, 0.8);"></span>
                    <button onclick="logout()" class="btn btn-danger">Logout</button>
                </div>
            </div>
        </header>

        <!-- Navigation -->
        <nav class="nav">
            <button onclick="showSection('dashboard')" class="nav-btn active" data-section="dashboard">📊 Dashboard</button>
            <button onclick="showSection('users')" class="nav-btn" data-section="users">👥 Users</button>
            <button onclick="showSection('missions')" class="nav-btn" data-section="missions">🎯 Missions</button>
            <button onclick="showSection('categories')" class="nav-btn" data-section="categories">💰 Categories</button>
            <button onclick="showSection('conversions')" class="nav-btn" data-section="conversions">🔄 Conversions</button>
            <button onclick="showSection('promo-codes')" class="nav-btn" data-section="promo-codes">🎫 Promo Codes</button>
        </nav>

        <!-- Content -->
        <main class="container">
            <!-- Dashboard Section -->
            <div id="dashboardSection" class="section">
                <div class="grid grid-4">
                    <div class="stat-card">
                        <div class="stat-number" id="totalUsers">0</div>
                        <div class="stat-label">Total Users</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="activeToday">0</div>
                        <div class="stat-label">Active Today</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="totalEarned">0</div>
                        <div class="stat-label">Total Earned</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="pendingConversions">0</div>
                        <div class="stat-label">Pending Conversions</div>
                    </div>
                </div>
            </div>

            <!-- Users Section -->
            <div id="usersSection" class="section hidden">
                <div class="flex-between" style="margin-bottom: 24px;">
                    <h2 style="font-size: 1.8rem;">User Management</h2>
                    <div class="flex">
                        <input type="text" id="userSearch" class="input" placeholder="Search users..." style="margin-bottom: 0; margin-right: 12px;">
                        <button onclick="searchUsers()" class="btn">Search</button>
                        <button onclick="showCreateUserModal()" class="btn btn-success" style="margin-left: 12px;">+ Add User</button>
                    </div>
                </div>
                
                <div class="card">
                    <div id="usersTable"></div>
                </div>
            </div>

            <!-- Categories Section -->
            <div id="categoriesSection" class="section hidden">
                <div class="flex-between" style="margin-bottom: 24px;">
                    <h2 style="font-size: 1.8rem;">Wallet Categories</h2>
                    <button onclick="showCreateCategoryModal()" class="btn btn-success">+ Add Category</button>
                </div>
                
                <div id="categoriesContainer" class="grid grid-2"></div>
            </div>

            <!-- Missions Section -->
            <div id="missionsSection" class="section hidden">
                <div class="flex-between" style="margin-bottom: 24px;">
                    <h2 style="font-size: 1.8rem;">Mission Management</h2>
                    <button onclick="showCreateMissionModal()" class="btn btn-success">+ Add Mission</button>
                </div>
                
                <div id="missionsContainer"></div>
            </div>

            <!-- Conversions Section -->
            <div id="conversionsSection" class="section hidden">
                <div class="flex-between" style="margin-bottom: 24px;">
                    <h2 style="font-size: 1.8rem;">Conversion Management</h2>
                    <select id="conversionFilter" onchange="loadConversions()" class="select">
                        <option value="all">All Conversions</option>
                        <option value="pending">Pending</option>
                        <option value="approved">Approved</option>
                        <option value="rejected">Rejected</option>
                    </select>
                </div>
                
                <div id="conversionsContainer"></div>
            </div>

            <!-- Promo Codes Section -->
            <div id="promoCodesSection" class="section hidden">
                <div class="flex-between" style="margin-bottom: 24px;">
                    <h2 style="font-size: 1.8rem;">Promo Code Management</h2>
                    <button onclick="showCreatePromoModal()" class="btn btn-success">+ Add Promo Codes</button>
                </div>
                
                <div id="promoCodesContainer"></div>
            </div>
        </main>
    </div>

    <!-- Modals -->
    <div id="modalContainer"></div>

    <script>
        let currentAdmin = null;
        const API_BASE = 'backend/panelApi.php';

        // API Request function
        async function apiRequest(endpoint, options = {}) {
            const url = `${API_BASE}?path=${encodeURIComponent(endpoint)}`;
            
            const headers = {
                'Content-Type': 'application/json',
                'X-Admin-Email': currentAdmin?.email || '',
                'X-Admin-Password': currentAdmin?.password || '',
                ...options.headers
            };

            try {
                const response = await fetch(url, {
                    ...options,
                    headers
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`HTTP ${response.status}: ${errorText}`);
                }

                return await response.json();
            } catch (error) {
                console.error(`API Request failed for ${endpoint}:`, error);
                throw error;
            }
        }

        // Login functionality
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('adminEmail').value;
            const password = document.getElementById('adminPassword').value;
            const errorDiv = document.getElementById('loginError');
            
            try {
                const response = await fetch(`${API_BASE}?path=login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    currentAdmin = { email, password };
                    document.getElementById('adminInfo').textContent = email;
                    document.getElementById('loginScreen').classList.add('hidden');
                    document.getElementById('dashboard').classList.remove('hidden');
                    showSection('dashboard');
                } else {
                    errorDiv.textContent = result.error || 'Login failed';
                    errorDiv.classList.remove('hidden');
                }
            } catch (error) {
                errorDiv.textContent = 'Connection error: ' + error.message;
                errorDiv.classList.remove('hidden');
            }
        });

        // Logout
        function logout() {
            currentAdmin = null;
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('dashboard').classList.add('hidden');
            document.getElementById('adminEmail').value = '';
            document.getElementById('adminPassword').value = '';
        }

        // Navigation
        function showSection(sectionName) {
            // Hide all sections
            document.querySelectorAll('.section').forEach(section => {
                section.classList.add('hidden');
            });
            
            // Remove active class from all nav buttons
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            
            // Show selected section
            const section = document.getElementById(sectionName + 'Section');
            if (section) {
                section.classList.remove('hidden');
                section.classList.add('fade-in');
            }
            
            // Highlight active nav button
            const navBtn = document.querySelector(`[data-section="${sectionName}"]`);
            if (navBtn) {
                navBtn.classList.add('active');
            }
            
            // Load section data
            switch (sectionName) {
                case 'dashboard':
                    loadDashboard();
                    break;
                case 'users':
                    loadUsers();
                    break;
                case 'missions':
                    loadMissions();
                    break;
                case 'categories':
                    loadCategories();
                    break;
                case 'conversions':
                    loadConversions();
                    break;
                case 'promo-codes':
                    loadPromoCodes();
                    break;
            }
        }

        // Load dashboard stats
        async function loadDashboard() {
            try {
                const stats = await apiRequest('stats');
                
                document.getElementById('totalUsers').textContent = stats.users?.total || 0;
                document.getElementById('activeToday').textContent = stats.users?.activeToday || 0;
                document.getElementById('totalEarned').textContent = (stats.mining?.totalEarned || 0).toFixed(2);
                document.getElementById('pendingConversions').textContent = stats.conversions?.pending || 0;
            } catch (error) {
                console.error('Failed to load dashboard:', error);
                // Set default values on error
                document.getElementById('totalUsers').textContent = '0';
                document.getElementById('activeToday').textContent = '0';
                document.getElementById('totalEarned').textContent = '0';
                document.getElementById('pendingConversions').textContent = '0';
            }
        }

        // Load users
        async function loadUsers(page = 1, search = '') {
            try {
                const data = await apiRequest(`users&page=${page}&search=${encodeURIComponent(search)}`);
                
                let html = `
                    <table class="table">
                        <thead>
                            <tr>
                                <th>User</th>
                                <th>Balance</th>
                                <th>Level</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                `;
                
                data.users.forEach(user => {
                    const statusClass = user.status === 'active' ? 'status-active' : 
                                       user.status === 'banned' ? 'status-banned' : 'status-pending';
                    
                    html += `
                        <tr>
                            <td>
                                <div class="flex">
                                    <img src="${user.avatar_url || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(user.first_name) + '&background=4CAF50&color=fff&size=40'}" 
                                         style="width: 40px; height: 40px; border-radius: 50%; margin-right: 12px;" alt="Avatar">
                                    <div>
                                        <div style="font-weight: 600;">${user.first_name} ${user.last_name || ''}</div>
                                        <div style="color: rgba(255, 255, 255, 0.6); font-size: 0.8rem;">${user.id}</div>
                                    </div>
                                </div>
                            </td>
                            <td>${parseFloat(user.balance).toFixed(3)} DRX</td>
                            <td>Level ${user.level_num}</td>
                            <td><span class="${statusClass}">${user.status}</span></td>
                            <td>
                                <button onclick="editUser('${user.id}')" class="btn" style="padding: 6px 12px; margin-right: 8px;">Edit</button>
                                <button onclick="banUser('${user.id}', '${user.status === 'banned' ? 'active' : 'banned'}')" 
                                        class="btn ${user.status === 'banned' ? 'btn-success' : 'btn-danger'}" style="padding: 6px 12px;">
                                    ${user.status === 'banned' ? 'Unban' : 'Ban'}
                                </button>
                            </td>
                        </tr>
                    `;
                });
                
                html += '</tbody></table>';
                document.getElementById('usersTable').innerHTML = html;
            } catch (error) {
                console.error('Failed to load users:', error);
                document.getElementById('usersTable').innerHTML = '<p style="text-align: center; color: rgba(255, 255, 255, 0.6);">Failed to load users</p>';
            }
        }

        // Search users
        function searchUsers() {
            const search = document.getElementById('userSearch').value;
            loadUsers(1, search);
        }

        // Edit user
        function editUser(userId) {
            showModal('Edit User', `
                <form id="editUserForm">
                    <input type="hidden" id="editUserId" value="${userId}">
                    <div class="form-group">
                        <label class="form-label">First Name</label>
                        <input type="text" id="editFirstName" class="input" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Last Name</label>
                        <input type="text" id="editLastName" class="input">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Balance</label>
                        <input type="number" id="editBalance" class="input" step="0.001" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Level</label>
                        <input type="number" id="editLevel" class="input" min="1" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">XP</label>
                        <input type="number" id="editXp" class="input" min="0" required>
                    </div>
                    <div class="flex" style="gap: 12px;">
                        <button type="submit" class="btn btn-success">Save Changes</button>
                        <button type="button" onclick="closeModal()" class="btn">Cancel</button>
                    </div>
                </form>
            `);
            
            // Load user data
            loadUserForEdit(userId);
        }

        // Ban/Unban user
        async function banUser(userId, newStatus) {
            try {
                await apiRequest(`users&userId=${userId}`, {
                    method: 'PUT',
                    body: JSON.stringify({ status: newStatus })
                });
                
                loadUsers(); // Reload users list
            } catch (error) {
                console.error('Failed to update user status:', error);
                alert('Failed to update user status');
            }
        }

        // Load categories
        async function loadCategories() {
            try {
                const categories = await apiRequest('categories');
                
                let html = '';
                categories.forEach(category => {
                    html += `
                        <div class="card">
                            <div class="flex-between" style="margin-bottom: 16px;">
                                <div class="flex">
                                    <img src="${category.image}" style="width: 60px; height: 60px; border-radius: 12px; object-fit: cover; margin-right: 16px;" alt="${category.name}">
                                    <div>
                                        <h3 style="font-size: 1.2rem; margin-bottom: 4px;">${category.name}</h3>
                                        <p style="color: rgba(255, 255, 255, 0.7); font-size: 0.9rem;">${category.description}</p>
                                    </div>
                                </div>
                                <div class="flex">
                                    <button onclick="editCategory('${category.id}')" class="btn" style="margin-right: 8px;">Edit</button>
                                    <button onclick="deleteCategory('${category.id}')" class="btn btn-danger">Delete</button>
                                </div>
                            </div>
                            
                            <div class="grid grid-2" style="font-size: 0.9rem; margin-bottom: 16px;">
                                <div>
                                    <span style="color: rgba(255, 255, 255, 0.6);">Min/Max:</span>
                                    <span>${category.minConversion} - ${category.maxConversion}</span>
                                </div>
                                <div>
                                    <span style="color: rgba(255, 255, 255, 0.6);">ID Length:</span>
                                    <span>${category.minIdLength} - ${category.maxIdLength}</span>
                                </div>
                                <div>
                                    <span style="color: rgba(255, 255, 255, 0.6);">Rate:</span>
                                    <span>${category.conversionRate}x</span>
                                </div>
                                <div>
                                    <span style="color: rgba(255, 255, 255, 0.6);">Status:</span>
                                    <span class="${category.active ? 'text-success' : 'text-danger'}">${category.active ? 'Active' : 'Inactive'}</span>
                                </div>
                            </div>
                            
                            <div style="color: rgba(255, 255, 255, 0.6); font-size: 0.8rem;">
                                Packages: ${category.packages.length}
                            </div>
                        </div>
                    `;

        // Load conversions

            try {
                const filter = document.getElementById('conversionFilter').value;

                conversions.forEach(conversion => {
                    const statusClass = conversion.status === 'approved' ? 'status-approved' : 
                                       conversion.status === 'rejected' ? 'status-rejected' : 'status-pending';
                    
                    html += `
                        <div class="card">
                            <div class="flex-between">
                                <div style="flex: 1;">
                                    <div class="flex" style="margin-bottom: 12px;">
                                        <h3 style="font-size: 1.1rem; margin-right: 12px;">${conversion.userName}</h3>
                                        <span class="${statusClass}" style="font-size: 0.8rem; padding: 4px 8px; background: rgba(255, 255, 255, 0.1); border-radius: 4px;">
                                            ${conversion.status}
                                        </span>
                                    </div>
                                    <p style="color: rgba(255, 255, 255, 0.7); margin-bottom: 12px;">${conversion.amount} DRX → ${conversion.convertedAmount} ${conversion.toCurrency}</p>
                                    <div style="font-size: 0.9rem; color: rgba(255, 255, 255, 0.6);">
                                        <p>Package: ${conversion.packageType}</p>

        // Load promo codes
        async function loadPromoCodes() {
            try {
                const promoCodes = await apiRequest('promo-codes');
                
                let html = '';
                promoCodes.forEach(promo => {
                    const usedClass = promo.used_by ? 'status-banned' : 'status-active';
                    
                    html += `
                        <div class="card">
                            <div class="flex-between">
                                <div style="flex: 1;">
                                    <div class="flex" style="margin-bottom: 12px;">
                                        <h3 style="font-family: monospace; font-size: 1.2rem; margin-right: 12px;">${promo.code}</h3>
                                        <span class="${usedClass}" style="font-size: 0.8rem; padding: 4px 8px; background: rgba(255, 255, 255, 0.1); border-radius: 4px;">
                                            ${promo.used_by ? 'Used' : 'Available'}
                                        </span>
                                    </div>
                                    <p style="color: rgba(255, 255, 255, 0.7); margin-bottom: 12px;">${promo.description}</p>
                                    <div style="font-size: 0.9rem; color: rgba(255, 255, 255, 0.6);">
                                        <p>Reward: ${promo.reward} DRX</p>
                                        <p>Created: ${new Date(promo.created_at).toLocaleString()}</p>
                                        ${promo.used_by ? `<p>Used by: ${promo.used_by_name} (${promo.used_by})</p>` : ''}
                                    </div>
                                </div>

                                    <button onclick="deletePromoCode('${promo.id}')" class="btn btn-danger">Delete</button>
                                </div>
                            </div>

                    `;
                });
                
                document.getElementById('promoCodesContainer').innerHTML = html;
            } catch (error) {
                console.error('Failed to load promo codes:', error);
                document.getElementById('promoCodesContainer').innerHTML = '<p style="text-align: center; color: rgba(255, 255, 255, 0.6);">Failed to load promo codes</p>';
            }
        }

        // Update conversion status
        async function updateConversion(conversionId, status) {
            try {
                await apiRequest(`conversions&conversionId=${conversionId}`, {
                    method: 'PUT',
                    body: JSON.stringify({ status })
                });
                
                loadConversions(); // Reload conversions
            } catch (error) {
                console.error('Failed to update conversion:', error);
                alert('Failed to update conversion');
            }
        }

        // Delete promo code
        async function deletePromoCode(codeId) {
            if (confirm('Are you sure you want to delete this promo code?')) {
                try {
                    await apiRequest(`promo-codes&codeId=${codeId}`, {
                        method: 'DELETE'
                    });
                    
                    loadPromoCodes(); // Reload promo codes
                } catch (error) {
                    console.error('Failed to delete promo code:', error);
                    alert('Failed to delete promo code');
                }
            }
        }

                        <h2 style="font-size: 1.5rem;">${title}</h2>
                        <button onclick="closeModal()" class="btn" style="padding: 8px 12px;">✕</button>
                    </div>
                    ${content}
                </div>
            `;
            
            document.getElementById('modalContainer').innerHTML = '';
            document.getElementById('modalContainer').appendChild(modal);
        }

                    name: document.getElementById('categoryName').value,
                    description: document.getElementById('categoryDescription').value,
                    image: document.getElementById('categoryImage').value,
                    iconUrl: document.getElementById('categoryIconUrl').value,
                    active: document.getElementById('categoryActive').checked,
                    minIdLength: parseInt(document.getElementById('categoryMinIdLength').value),
                    maxIdLength: parseInt(document.getElementById('categoryMaxIdLength').value),
                    requiredFields: [],
                    packages: []
                };
                
                await apiRequest('categories', {
                    method: 'POST',
                    body: JSON.stringify(categoryData)
                });
                
                closeModal();
                loadCategories();
            } catch (error) {
                console.error('Failed to create category:', error);
                alert('Failed to create category');
            }

        async function createMission(e) {
            e.preventDefault();
            
            try {
                const missionData = {
                    title: document.getElementById('missionTitle').value,
                    description: document.getElementById('missionDescription').value,
                    type: document.getElementById('missionType').value,
                    reward: parseInt(document.getElementById('missionReward').value),
                    priority: parseInt(document.getElementById('missionPriority').value),
                    category: document.getElementById('missionCategory').value,
                    channelId: document.getElementById('missionChannelId').value,
                    url: document.getElementById('missionUrl').value,
                    code: document.getElementById('missionCode').value,
                    requiredTime: document.getElementById('missionRequiredTime').value ? parseInt(document.getElementById('missionRequiredTime').value) : null,
                    active: document.getElementById('missionActive').checked
                };

                    method: 'POST',

                });
                
                closeModal();
                loadMissions();

                console.error('Failed to create mission:', error);
                alert('Failed to create mission');
            }
        }

                const codes = document.getElementById('promoCodes').value.split('\n').filter(code => code.trim());

                const description = document.getElementById('promoDescription').value;
                const expiresAt = document.getElementById('promoExpiresAt').value || null;
                
                await apiRequest('promo-codes', {

                closeModal();
                loadPromoCodes();
            } catch (error) {
                console.error('Failed to create promo codes:', error);
                alert('Failed to create promo codes');
            }
        }

        async function loadUserForEdit(userId) {
            try {
                const users = await apiRequest(`users&search=${userId}`);
                const user = users.users.find(u => u.id === userId);
                
                if (user) {
                    document.getElementById('editFirstName').value = user.first_name;
                    document.getElementById('editLastName').value = user.last_name || '';
                    document.getElementById('editBalance').value = user.balance;
                    document.getElementById('editLevel').value = user.level_num;
                    document.getElementById('editXp').value = user.xp;
                }
            } catch (error) {
                console.error('Failed to load user for edit:', error);
            }
        }
